# ui-muyu bundle patch: inserts the wooden-fish plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field). The node half (exports ".") is inert; the `dsh.client` declaration in
# package.json loads the browser half (exports "./client") in the web GUI.
- insert:
    - id: ui-muyu
      name: '@deepseek-ai/dsh-client-ui-muyu'
